name: Bootstrap npm lockfile

on:
  push:
    branches:
      - codex/reproducible-npm-installs

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reproducible-npm-installs
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/bootstrap-lockfile.yml
          git commit -m "build: commit npm lockfile"
          git push origin HEAD:codex/reproducible-npm-installs
      - name: Verify clean install
        run: npm ci --no-audit --no-fund
      - name: Build application
        run: npm run build
