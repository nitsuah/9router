name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: jobs only read the repo. Nothing here needs secrets, so this
# is safe to run on fork PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22" # matches the Dockerfile base image
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  security-tests:
    name: Security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # No committed root lockfile (package-lock.json is gitignored), so `npm ci` is not possible.
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: tests
      - name: Run tests listed in tests/security-suite.txt (hard gate)
        working-directory: tests
        run: npx vitest run $(grep -vE '^\s*(#|$)' security-suite.txt)

  test-suite:
    name: Full test suite (no-regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: tests
      # The suite is not all-green yet; known failures live in
      # tests/__baseline__/known-fails.txt. The gate fails only on a pass→fail change.
      - name: Run full suite
        working-directory: tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=results.json || true
      - name: No-regression gate
        run: node tests/__baseline__/verify-no-regression.mjs tests/results.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: tests/results.json
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Resolve a lockfile the same way the Docker image does, then audit what ships.
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Blocks PRs that add a dependency with a known high/critical advisory.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  lint:
    name: Lint changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory for now: master still has ~800 existing ESLint findings, so this only
    # reports on files the PR touches and does not block. Flip to blocking once clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - name: ESLint on changed JS files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.js' '*.mjs' '*.jsx' > changed.txt
          if [ -s changed.txt ]; then xargs -d '\n' npx eslint < changed.txt; else echo "No JS changes"; fi
